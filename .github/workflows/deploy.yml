name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.8.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Verify built site includes CSS
        shell: bash
        run: |
          test -s dist/index.html
          css_file="$(find dist/assets -maxdepth 1 -type f -name '*.css' -print -quit)"
          test -n "$css_file"
          test -s "$css_file"

      - name: Verify bundled split game data
        shell: bash
        run: |
          test -s dist/manifest.json
          test -s dist/icon.svg
          node --input-type=module <<'NODE'
          import { readFileSync, statSync } from "node:fs";

          const root = "dist/game-data/vcbr";
          const manifest = JSON.parse(readFileSync(`${root}/chunks/manifest.json`, "utf8"));
          const index = JSON.parse(readFileSync(`${root}/vc-sky-en-v6.json`, "utf8"));

          if (!Array.isArray(manifest.parts) || manifest.parts.length === 0) {
            throw new Error("Split-data manifest has no parts");
          }

          const total = manifest.parts.reduce((sum, part) => sum + part.size, 0);
          if (total !== manifest.size || index.remote_package_size !== manifest.size) {
            throw new Error("Split-data manifest and package index do not match");
          }

          for (const part of manifest.parts) {
            const path = `${root}/chunks/${part.name}`;
            const actual = statSync(path).size;
            if (actual !== part.size) {
              throw new Error(`${part.name}: expected ${part.size} bytes, got ${actual}`);
            }
          }

          console.log(`Verified ${manifest.parts.length} split chunks (${manifest.size} bytes)`);
          NODE

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
